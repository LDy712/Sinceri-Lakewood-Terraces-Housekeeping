<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Apartment Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="floor-container">

    <!-- Your SVG floorplan -->
    <img src="floorplan.svg" class="floor-image">

    <!-- Clickable Areas -->
    <div class="room room1" data-room="Living Room"></div>

    <div class="room room2" data-room="Kitchen"></div>

    <div class="room room3" data-room="Bedroom"></div>

</div>

<script src="script.js"></script>

</body>
</html>
